

  name: NRL Automation Engine

on:
  workflow_dispatch:      # Allows you to click the manual "Run workflow" button anytime
  schedule:
    - cron: '0 23 * * 7'  # Launches automatically every Monday morning at 9:00 AM AEST (23:00 UTC Sunday)

jobs:
  run-predictor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Execute Model Compilation
        run: python "bm predictions.py"

      - name: Push Compiled Changes Back to Repository Home Page
        run: |
          git config --global user.name "NRL-Prediction-Bot"
          git config --global user.email "bot@github.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || git commit -m "Automated halftime tracking post-match post-mortem evaluation updates"
          git push
