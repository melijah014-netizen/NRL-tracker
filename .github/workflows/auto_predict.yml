name: NRL Automation Engine

on:
  workflow_dispatch:      # Allows you to click the manual "Run workflow" button anytime
  schedule:
    - cron: '0 21 * * *'  # Runs automatically every single day at 7:00 AM AEST to keep matches fresh

jobs:
  run-predictor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas beautifulsoup4 lxml

      - name: Execute Model Compilation
        run: |
          python "./bm predictions.py"

      - name: Push Compiled Changes Back to Repository Home Page
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || (git commit -m "Automated halftime tracking evaluation updates" && git push)
